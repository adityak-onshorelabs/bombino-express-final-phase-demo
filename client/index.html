<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:title" content="Bombino Express" />
    <meta property="og:description" content="USA to India shipping made simple. Track shipments, get instant rates, and create bookings in minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://replit.com/public/images/opengraph.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="Bombino Express" />
    <meta name="twitter:description" content="USA to India shipping made simple. Track shipments, get instant rates, and create bookings in minutes." />
    <meta name="twitter:image" content="https://replit.com/public/images/opengraph.png" />

    <title>Bombino Express</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- 3CX Live Chat — hidden globally, opened programmatically -->
    <call-us
      id="tcx-call-us"
      phonesystem-url="https://bombino.3cx.in:5001"
      style="display:none"
      party="LiveChat239761"
      allow-call="true"
      allow-video="false"
      allow-soundnotifications="true"
      enable-mute="true"
      enable-onmobile="true"
      offline-enabled="true"
      enable="true"
      ignore-queueownership="false"
      authentication="both"
      show-operator-actual-name="true"
      aknowledge-received="true"
      gdpr-enabled="false"
      message-userinfo-format="both"
      message-dateformat="both"
      lang="browser"
      button-icon-type="doublebubble"
      greeting-visibility="none"
      greeting-offline-visibility="none"
      chat-delay="2000"
      enable-direct-call="true"
      enable-ga="false"
    ></call-us>

    <script
      defer
      src="https://downloads-global.3cx.com/downloads/livechatandtalk/v1/callus.js"
      id="tcx-callus-js"
      charset="utf-8"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
